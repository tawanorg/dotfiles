# Ctrl-a is easier to reach than Ctrl-b and doesn't fight readline's ^B
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1                # windows start at 1, matching the number keys
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 10             # don't swallow Esc in vim
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"   # true colour passthrough

# Split panes in the current directory, with keys that look like the split
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display "reloaded"

# Catppuccin Mocha status line
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]%H:%M  #[bg=#89b4fa,fg=#1e1e2e,bold] #h "
set -g status-left-length 30
setw -g window-status-current-style "fg=#89b4fa,bold"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-style "fg=#45475a"
